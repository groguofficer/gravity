<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Log</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"></script>
<style>
  :root {
    --bg: #f2ead9;
    --panel: #fbf6ea;
    --ink: #3e3226;
    --muted: #7a6a53;
    --line: #8a9a5b;
    --line-fill: rgba(138, 154, 91, 0.15);
    --accent: #a9744f;
    --border: #d8c9a8;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 2rem 1rem;
    min-height: 100vh;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 20% 20%, rgba(169, 116, 79, 0.06), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(138, 154, 91, 0.08), transparent 45%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: var(--ink);
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .card {
    width: 100%;
    max-width: 900px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 2rem;
    box-shadow: 0 6px 18px rgba(62, 50, 38, 0.08);
  }

  h1 {
    margin: 0 0 0.25rem 0;
    font-size: 1.6rem;
    letter-spacing: 0.02em;
    color: var(--ink);
  }

  .subtitle {
    margin: 0 0 1.5rem 0;
    color: var(--muted);
    font-size: 0.95rem;
  }

  .chart-wrap {
    position: relative;
    height: 420px;
    width: 100%;
  }

  .status {
    text-align: center;
    color: var(--muted);
    padding: 3rem 0;
    font-size: 0.95rem;
  }

  .status.error {
    color: #a04a3a;
  }

  footer {
    margin-top: 1.25rem;
    text-align: right;
    font-size: 0.78rem;
    color: var(--muted);
  }

  .grid-card {
    margin-top: 1.75rem;
  }

  .grid-card h2 {
    margin: 0 0 0.25rem 0;
    font-size: 1.3rem;
    color: var(--ink);
  }

  .grid-legend {
    display: flex;
    gap: 1.25rem;
    margin-bottom: 1.25rem;
    font-size: 0.85rem;
    color: var(--muted);
    flex-wrap: wrap;
  }

  .legend-item {
    display: inline-flex;
    align-items: center;
    gap: 0.4rem;
  }

  .swatch {
    display: inline-block;
    width: 12px;
    height: 12px;
    border-radius: 3px;
    border: 1px solid var(--border);
  }

  .swatch.yes { background: var(--line); border-color: var(--line); }
  .swatch.no { background: var(--panel); }
  .swatch.empty { background: transparent; border-style: dashed; }

  .year-grid-wrapper {
    margin-bottom: 2rem;
    overflow-x: auto;
  }

  .year-grid-title {
    margin: 0 0 0.6rem 0;
    font-size: 1.05rem;
    color: var(--accent);
    letter-spacing: 0.03em;
  }

  table.year-grid {
    border-collapse: collapse;
    font-size: 0.72rem;
    color: var(--muted);
  }

  table.year-grid th {
    font-weight: 600;
    padding: 3px 4px;
    text-align: center;
  }

  table.year-grid td.cell {
    width: 18px;
    height: 18px;
    border: 1px solid var(--border);
    border-radius: 3px;
    background: var(--panel);
  }

  table.year-grid td.cell.yes {
    background: var(--line);
    border-color: var(--line);
  }

  table.year-grid td.cell.no {
    background: var(--panel);
  }

  table.year-grid td.cell.empty {
    background: transparent;
    border: 1px dashed var(--border);
  }

  table.year-grid td.cell.invalid {
    background: transparent;
    border: none;
  }
</style>
</head>
<body>

<div class="card">
  <h1> Trend</h1>
  <p class="subtitle">So whether you eat or drink or whatever you do, do it all for the glory of God. - 1 Corinthians 10:31</p>
  <div class="chart-wrap">
    <canvas id="gravityChart"></canvas>
  </div>
  <div id="status" class="status">Loading data…</div>
  <footer>Source: Google Sheets </footer>
</div>

<div class="card grid-card">
  <h2>🍽️ No Food After 2pm</h2>
  <p class="subtitle">One grid per year — columns are months, rows are days of the month.</p>
  <div class="grid-legend">
    <span class="legend-item"><span class="swatch yes"></span> Yes</span>
    <span class="legend-item"><span class="swatch no"></span> No</span>
    
  </div>
  <div id="yearGrids"></div>
  <div id="gridStatus" class="status"></div>
</div>

<script>
  // ---- Configuration ----
  // Published-to-web CSV export link for the sheet/tab.
  const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vThlXwnKPG_djBYUmfTn1e1K1XwRCa1ufzGgdmnzmGkAka7xVkc_8OabYhIM1El-hlz9xIMjm07SDTV/pub?gid=0&single=true&output=csv";

  const statusEl = document.getElementById('status');

  function setStatus(msg, isError = false) {
    statusEl.textContent = msg;
    statusEl.className = 'status' + (isError ? ' error' : '');
    statusEl.style.display = msg ? 'block' : 'none';
  }

  // ---- Minimal CSV parser (handles quoted fields, commas & newlines inside quotes) ----
  function parseCSV(text) {
    const rows = [];
    let row = [];
    let field = '';
    let inQuotes = false;

    for (let i = 0; i < text.length; i++) {
      const c = text[i];

      if (inQuotes) {
        if (c === '"') {
          if (text[i + 1] === '"') { field += '"'; i++; }
          else { inQuotes = false; }
        } else {
          field += c;
        }
      } else {
        if (c === '"') {
          inQuotes = true;
        } else if (c === ',') {
          row.push(field);
          field = '';
        } else if (c === '\n') {
          row.push(field);
          rows.push(row);
          row = [];
          field = '';
        } else if (c === '\r') {
          // skip; \n will terminate the row
        } else {
          field += c;
        }
      }
    }
    // last field/row (in case file doesn't end with newline)
    if (field.length > 0 || row.length > 0) {
      row.push(field);
      rows.push(row);
    }
    return rows.filter(r => r.some(cell => cell !== ''));
  }

  function parseSheetDate(raw) {
    if (raw === null || raw === undefined) return new Date(NaN);
    const str = String(raw).trim();

    if (/^\d{1,2}\/\d{1,2}\/\d{2,4}$/.test(str)) {
      // Day-first format, e.g. 13/9/2026
      const [d, m, y] = str.split('/').map(Number);
      const fullYear = y < 100 ? 2000 + y : y;
      return new Date(fullYear, m - 1, d);
    } else if (/^\d{4}-\d{2}-\d{2}/.test(str)) {
      // ISO format YYYY-MM-DD
      return new Date(str);
    }
    return new Date(str);
  }

  function toTable(rows) {
    // First row = headers
    const headers = rows[0].map(h => (h || '').toLowerCase().trim());
    const dataRows = rows.slice(1);
    return { headers, dataRows };
  }

  function extractRows(headers, dataRows) {
    let dateIdx = headers.findIndex(c => c.includes('date'));
    let entryIdx = headers.findIndex(c => c.includes('entry'));
    if (dateIdx === -1) dateIdx = 0;
    if (entryIdx === -1) entryIdx = 1;

    const rows = dataRows
      .map(r => {
        const rawDate = r[dateIdx];
        const rawEntry = r[entryIdx];
        if (rawDate === undefined || rawEntry === undefined || rawEntry === '') return null;

        const dateVal = parseSheetDate(rawDate);
        const entryVal = parseFloat(rawEntry);
        if (isNaN(dateVal.getTime()) || isNaN(entryVal)) return null;

        return { x: dateVal, y: entryVal };
      })
      .filter(Boolean)
      .sort((a, b) => a.x - b.x);

    return rows;
  }

  function extractFoodFlags(headers, dataRows) {
    const dateIdx = headers.findIndex(c => c.includes('date'));
    const foodIdx = headers.findIndex(c => c.includes('no food') || (c.includes('food') && c.includes('2pm')));
    if (dateIdx === -1 || foodIdx === -1) return null; // column not present in the sheet

    const flags = dataRows
      .map(r => {
        const rawDate = r[dateIdx];
        if (rawDate === undefined || rawDate === '') return null;

        const dateVal = parseSheetDate(rawDate);
        if (isNaN(dateVal.getTime())) return null;

        const rawVal = r[foodIdx];
        const isY = typeof rawVal === 'string' && rawVal.trim().toUpperCase() === 'Y';

        return { date: dateVal, isY };
      })
      .filter(Boolean);

    return flags;
  }

  function buildYearMap(flags) {
    const byYear = {};
    flags.forEach(f => {
      const year = f.date.getFullYear();
      const month = f.date.getMonth();
      const day = f.date.getDate();
      if (!byYear[year]) byYear[year] = {};
      byYear[year][`${month}-${day}`] = f.isY;
    });
    return byYear;
  }

  function renderYearGrid(year, dataMap, container) {
    const monthNames = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    const wrapper = document.createElement('div');
    wrapper.className = 'year-grid-wrapper';

    const title = document.createElement('h3');
    title.className = 'year-grid-title';
    title.textContent = year;
    wrapper.appendChild(title);

    const table = document.createElement('table');
    table.className = 'year-grid';

    const thead = document.createElement('thead');
    const headRow = document.createElement('tr');
    headRow.appendChild(document.createElement('th'));
    monthNames.forEach(m => {
      const th = document.createElement('th');
      th.textContent = m;
      headRow.appendChild(th);
    });
    thead.appendChild(headRow);
    table.appendChild(thead);

    const tbody = document.createElement('tbody');
    for (let day = 1; day <= 31; day++) {
      const tr = document.createElement('tr');
      const dayTh = document.createElement('th');
      dayTh.textContent = day;
      dayTh.scope = 'row';
      tr.appendChild(dayTh);

      for (let month = 0; month < 12; month++) {
        const td = document.createElement('td');
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        if (day > daysInMonth) {
          td.className = 'cell invalid';
        } else {
          const val = dataMap[`${month}-${day}`];
          if (val === true) {
            td.className = 'cell yes';
            td.title = `${monthNames[month]} ${day}, ${year}: Y`;
          } else if (val === false) {
            td.className = 'cell no';
            td.title = `${monthNames[month]} ${day}, ${year}: N`;
          } else {
            td.className = 'cell empty';
            td.title = `${monthNames[month]} ${day}, ${year}: no data`;
          }
        }
        tr.appendChild(td);
      }
      tbody.appendChild(tr);
    }
    table.appendChild(tbody);
    wrapper.appendChild(table);
    container.appendChild(wrapper);
  }

  async function loadChart() {
    try {
      if (typeof Chart === 'undefined') {
        throw new Error('The charting library failed to load from the CDN. This is usually caused by an ad-blocker or privacy extension — try disabling it for this page and reloading.');
      }

      const res = await fetch(CSV_URL);
      if (!res.ok) throw new Error(`Could not reach the sheet (HTTP ${res.status}). Make sure the sheet is published to the web (File > Share > Publish to web).`);
      const text = await res.text();
      const parsed = parseCSV(text);
      if (parsed.length < 2) {
        setStatus('No valid entries found in the published sheet yet.');
        return;
      }
      const { headers, dataRows } = toTable(parsed);
      const rows = extractRows(headers, dataRows);

      if (rows.length === 0) {
        setStatus('No valid entries found in the published sheet yet.');
        return;
      }

      setStatus('');

      // ---- Line chart ----
      const TARGET_VALUE = 59;
      const lowestEntry = Math.min(...rows.map(r => r.y));
      const yAxisMin = Math.min(TARGET_VALUE - 2, lowestEntry - 2);
      const targetLine = [
        { x: rows[0].x, y: TARGET_VALUE },
        { x: rows[rows.length - 1].x, y: TARGET_VALUE }
      ];

      const ctx = document.getElementById('gravityChart').getContext('2d');
      new Chart(ctx, {
        type: 'line',
        data: {
          datasets: [
            {
              label: 'Entry',
              data: rows,
              borderColor: '#8a9a5b',
              backgroundColor: 'rgba(138, 154, 91, 0.15)',
              pointBackgroundColor: '#a9744f',
              pointBorderColor: '#fbf6ea',
              pointRadius: 4,
              pointHoverRadius: 6,
              borderWidth: 2,
              tension: 0.25,
              fill: true,
              order: 1,
            },
            {
              label: `Target (${TARGET_VALUE})`,
              data: targetLine,
              borderColor: '#a9744f',
              borderDash: [6, 5],
              borderWidth: 2,
              pointRadius: 0,
              pointHitRadius: 0,
              fill: false,
              tension: 0,
              order: 0,
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: {
            legend: {
              display: true,
              labels: { color: '#7a6a53', usePointStyle: true, boxWidth: 8 }
            },
            tooltip: {
              backgroundColor: '#3e3226',
              titleColor: '#fbf6ea',
              bodyColor: '#fbf6ea',
              padding: 10,
              cornerRadius: 6,
            }
          },
          scales: {
            x: {
              type: 'time',
              time: { unit: 'day', tooltipFormat: 'MMM d, yyyy' },
              grid: { color: '#e4d9bd' },
              ticks: { color: '#7a6a53' }
            },
            y: {
              min: yAxisMin,
              grid: { color: '#e4d9bd' },
              ticks: { color: '#7a6a53' },
              title: { display: true, text: 'Entry', color: '#7a6a53' }
            }
          }
        }
      });

      // ---- No Food After 2pm year grids ----
      const gridContainer = document.getElementById('yearGrids');
      const gridStatusEl = document.getElementById('gridStatus');
      const flags = extractFoodFlags(headers, dataRows);

      if (flags === null) {
        gridStatusEl.textContent = 'Column "No Food after 2pm" was not found in the sheet.';
        gridStatusEl.style.display = 'block';
      } else if (flags.length === 0) {
        gridStatusEl.textContent = 'No entries found for "No Food after 2pm" yet.';
        gridStatusEl.style.display = 'block';
      } else {
        gridStatusEl.style.display = 'none';
        const byYear = buildYearMap(flags);
        Object.keys(byYear)
          .sort()
          .forEach(year => renderYearGrid(year, byYear[year], gridContainer));
      }

    } catch (err) {
      console.error(err);
      setStatus('⚠ ' + err.message, true);
    }
  }

  window.addEventListener('load', loadChart);
</script>

</body>
</html>
